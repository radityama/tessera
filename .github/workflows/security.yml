name: security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly, off the hour so it does not collide with everyone else's cron.
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          # Security queries only. The default suite also runs maintainability
          # queries, which on a project this size produces more noise than signal.
          queries: security-extended

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"

  dependency-review:
    name: dependency review
    runs-on: ubuntu-latest
    # Only meaningful on a pull request, and only useful when the repository
    # Dependency Graph is available.
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/dependency-review-action@v4
        with:
          # Fail on a known-vulnerable dependency, not merely report it.
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
